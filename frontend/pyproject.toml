[project]
name = "componentmatch-frontend"
version = "0.1.0"
description = "Independent Streamlit client for the ComponentMatch HTTP API"
requires-python = ">=3.11"
dependencies = [
    "componentmatch-contracts",
    "streamlit>=1.40,<2",
    "altair>=5,<7",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/componentmatch_frontend"]
