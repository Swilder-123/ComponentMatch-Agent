name: 问题反馈
description: 报告安装、启动或匹配行为的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用 DEMO 需求复现，不要粘贴密钥、完整 .env 或真实采购数据。
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python / uv 版本、使用的启动命令，以及对应提交版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪一步开始出现问题？可提供脱敏后的需求文本。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 错误码、请求 ID、脱敏日志或截图；请注明真实模型、Mock 或模板解释。
    validations:
      required: true
