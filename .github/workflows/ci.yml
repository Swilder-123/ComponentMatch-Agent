name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: .venv-ci
      UV_LINK_MODE: copy
      PYTHONIOENCODING: utf-8
      DEEPSEEK_API_KEY: ""
      LANGSMITH_TRACING: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Validate lockfile and install development dependencies
        run: uv sync --locked --python 3.11

      - name: Lint Python
        run: uv run --no-sync ruff check --no-cache backend frontend packages scripts tests

      - name: Check Python formatting
        run: uv run --no-sync ruff format --no-cache --check backend frontend packages scripts tests

      - name: Check documentation and local links
        run: uv run --no-sync python scripts/check_docs.py

      - name: Run offline tests
        run: uv run --no-sync pytest -q

      - name: Recheck lockfile
        run: uv lock --check
