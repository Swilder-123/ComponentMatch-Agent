[project]
name = "componentmatch-agent"
version = "0.1.0"
description = "ComponentMatch FastAPI backend and deterministic matching engine"
requires-python = ">=3.11"
dependencies = [
    "componentmatch-contracts",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "langgraph>=1,<2",
    "langchain>=1,<2",
    "langchain-deepseek>=1,<2",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "tzdata>=2025",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/componentmatch"]
