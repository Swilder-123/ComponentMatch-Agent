[project]
name = "componentmatch-contracts"
version = "0.1.0"
description = "Shared HTTP request and response contracts; no backend or UI dependencies"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/componentmatch_contracts"]
